<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevVault</title>
    <!--
      Content-Security-Policy: no remote scripts, no remote connections.
      This app is local-first; nothing should ever reach the network.
      'unsafe-inline' for styles is required by the Vite dev server and by
      Tailwind's injected styles in dev.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; media-src 'self' file:; connect-src 'self' ws://localhost:*; font-src 'self' data:"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
